name: ${CPAG_PROJECT_NAME:-cpag-v3}

x-runtime: &runtime
  image: ${CPAG_IMAGE:-cpag-v3:local}
  build:
    context: ..
    dockerfile: deployments/v3/Dockerfile
    target: runtime

services:
  bootstrap:
    <<: *runtime
    entrypoint: [python3, /opt/cpag/deploy/bootstrap.py]
    network_mode: none
    environment:
      CPAG_HTTP_PORT: ${CPAG_HTTP_PORT:-3000}
      CPAG_EXTERNAL_ORIGIN: ${CPAG_EXTERNAL_ORIGIN:-}
    volumes:
      - app-config:/bootstrap/api
      - worker-config:/bootstrap/worker
      - relay-config:/bootstrap/relay
      - postgres-secret:/bootstrap/postgres
      - shared:/bootstrap/shared
      - control:/bootstrap/control
      - verify-channel:/bootstrap/verify
      - verifier-config:/bootstrap/verifier
    read_only: true
    restart: 'no'

  postgres:
    image: mirror.gcr.io/library/postgres@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    environment:
      POSTGRES_DB: cpag_v3
      POSTGRES_PASSWORD_FILE: /run/cpag-postgres/password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-secret:/run/cpag-postgres:ro
      - postgres-data:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U postgres -d cpag_v3]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *runtime
    entrypoint: [/opt/cpag/bin/cpag-migrate]
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - app-config:/etc/cpag:ro
    networks: [private]
    read_only: true
    cap_drop: [ALL]
    restart: 'no'

  source-verifier:
    <<: *runtime
    entrypoint: [python3, /opt/cpag/source-verifier.py]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    environment:
      CPAG_VERIFY_BACKEND: compose-file-sidecar-v1
      CPAG_VERIFIER_IDENTITY_FILE: /etc/cpag-verifier/source.identity
      PYTHONPATH: /opt/cpag/services/analysis/src
    network_mode: none
    volumes:
      - verifier-config:/etc/cpag-verifier:ro
      - shared:/state/shared:ro
      - verify-channel:/verify-channel
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=4g,mode=1777
    mem_limit: 8g
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python3, -c, "import os,stat; assert stat.S_ISSOCK(os.stat('/verify-channel/source.sock').st_mode)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *runtime
    depends_on:
      migrate: {condition: service_completed_successfully}
      source-verifier: {condition: service_healthy}
    environment:
      CPAG_VERIFY_BACKEND: compose-file-sidecar-v1
      CPAG_HTTP_PORT: ${CPAG_HTTP_PORT:-3000}
      CPAG_EXTERNAL_ORIGIN: ${CPAG_EXTERNAL_ORIGIN:-}
    ports:
      - '127.0.0.1:${CPAG_HTTP_PORT:-3000}:8080'
    networks:
      frontend: {}
      private:
        aliases: [cpag-resident-internal]
    volumes:
      - app-config:/etc/cpag:ro
      - shared:/state/shared
      - control:/state/control
      - verify-channel:/verify-channel
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/health/ready',timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  private-relay:
    <<: *runtime
    entrypoint: [python3, /opt/cpag/private_relay.py]
    depends_on:
      api: {condition: service_healthy}
    network_mode: service:api
    volumes:
      - relay-config:/etc/cpag:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python3, -c, "import socket; s=socket.create_connection(('127.0.0.1',8096),2); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  resident-worker:
    <<: *runtime
    entrypoint: [python3, -m, cpag_worker.resident_service]
    command: [--config, /private/config.json, --work-root, /resident-work, --dispatch-mode, poll]
    init: false
    depends_on:
      private-relay: {condition: service_healthy}
    networks: [private]
    volumes:
      - worker-config:/private:ro
      - shared:/state/shared
      - control:/state/control
    tmpfs:
      - /resident-work:rw,nosuid,nodev,size=4g,mode=0711
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, KILL]
    security_opt: [no-new-privileges:true]
    mem_limit: 13g
    pids_limit: 96
    stop_grace_period: 60s
    restart: unless-stopped

  relay:
    image: ${CPAG_RELAY_IMAGE:-cpag-v3-relay:local}
    build:
      context: ..
      dockerfile: deployments/v3/Dockerfile
      target: relay
    depends_on:
      api: {condition: service_healthy}
    network_mode: service:api
    user: '101:101'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    restart: unless-stopped

networks:
  frontend: {}
  private: {internal: true}

volumes:
  app-config: {}
  worker-config: {}
  relay-config: {}
  postgres-secret: {}
  verifier-config: {}
  postgres-data: {}
  shared: {}
  control: {}
  verify-channel: {}
