worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  client_body_temp_path /tmp/client-body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server {
    listen 8080;
    absolute_redirect off;
    client_max_body_size 128m;
    location = / { return 302 /workbench/$is_args$args; }
    location = /index.html { return 302 /workbench/$is_args$args; }
    location = /workspace { return 302 /workbench/$is_args$args; }
    location = /workspace.html { return 302 /workbench/$is_args$args; }
    location ^~ /workspace/ { return 302 /workbench/$is_args$args; }
    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Connection "";
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 610s;
      proxy_pass http://127.0.0.1:8095;
    }
  }
}
