# Render this template with render-proxy.py. Only the public loopback API is proxied.
user @NGINX_USER@;
worker_processes auto;
pid /run/cpag-proxy.pid;
error_log /var/log/cpag/proxy-error.log warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format cpag_safe '$time_iso8601 $request_method $uri $status $body_bytes_sent';
    access_log /var/log/cpag/proxy-access.log cpag_safe;
    sendfile on;
    client_body_temp_path /var/cache/cpag-proxy;
    client_max_body_size 128m;
    client_body_timeout 65s;
    map $http_host $cpag_https_host_ok { default 0; @HTTPS_HOSTS@ }
    map $http_host $cpag_http_host_ok { default 0; @HTTP_HOSTS@ }
    server {
        listen 80 default_server;
        server_name _;
        default_type application/json;
        return 421 '{"error":{"code":"unrecognized_host","message":"unrecognized deployment host"}}';
    }
    server {
        listen 80;
        server_name @SERVER_NAME@;
        default_type application/json;
        if ($cpag_http_host_ok = 0) { return 421 '{"error":{"code":"unrecognized_host","message":"unrecognized deployment host"}}'; }
        location /.well-known/acme-challenge/ {
            root /var/lib/cpag-acme;
            limit_except GET HEAD { deny all; }
            try_files $uri =404;
        }
        location / { return 308 @ORIGIN@$request_uri; }
    }
    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_certificate /etc/cpag/tls/cert.pem;
        ssl_certificate_key /etc/cpag/tls/key.pem;
        default_type application/json;
        return 421 '{"error":{"code":"unrecognized_host","message":"unrecognized deployment host"}}';
    }
    server {
        listen 443 ssl;
        server_name @SERVER_NAME@;
        ssl_certificate /etc/cpag/tls/cert.pem;
        ssl_certificate_key /etc/cpag/tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        if ($cpag_https_host_ok = 0) { return 421 '{"error":{"code":"unrecognized_host","message":"unrecognized deployment host"}}'; }
        error_page 413 = @cpag_body_too_large;
        location @cpag_body_too_large {
            default_type application/json;
            return 413 '{"error":{"code":"proxy_size_limit","message":"request body exceeds this endpoint limit"}}';
        }
        location ~ ^/api/v3/datasets/[A-Za-z0-9_-]+/files$ {
            client_max_body_size 64m;
            # The API also enforces process CSV/XLS/XLSX 8MiB by verified role.
            include /etc/cpag/proxy-location.conf;
        }
        # Includes saved evaluation imports up to the application's 128MiB limit.
        location / { include /etc/cpag/proxy-location.conf; }
    }
}
