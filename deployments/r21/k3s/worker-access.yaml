apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cpag-worker-execution
  namespace: cpag
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cpag-worker-execution
  namespace: cpag
subjects:
  - kind: ServiceAccount
    name: cpag-worker
    namespace: cpag
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cpag-worker-execution
