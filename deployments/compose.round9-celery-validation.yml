# Disposable services for scripts/validation/round9_celery.py only.
# Never combine this file with the default production/local deployment.
services:
  rabbitmq:
    image: mirror.gcr.io/library/rabbitmq:3.13.7-management
    ports: ["127.0.0.1::5672", "127.0.0.1::15672"]
    environment:
      RABBITMQ_DEFAULT_USER: cpag_round9
      RABBITMQ_DEFAULT_PASS: disposable-round9-only
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: mirror.gcr.io/library/redis:7.4.2-alpine
    ports: ["127.0.0.1::6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
