name: M1 synthetic contracts and builds
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  unified-catalog:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -r services/analysis/requirements-test.txt
      - uses: actions/download-artifact@v4
        with:
          name: frontend-static
          path: webui/out
      - run: npm install --prefix "$RUNNER_TEMP/browser" playwright@1.61.0
      - run: "$RUNNER_TEMP/browser/node_modules/.bin/playwright install --with-deps chromium"
      - name: Normal Go entry, isolated Worker, role boundaries and catalog restore
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser/node_modules/playwright
        run: bash scripts/validation/round16_acceptance.sh "$RUNNER_TEMP/round16"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-catalog-evidence
          path: |
            ${{ runner.temp }}/round16/public
            ${{ runner.temp }}/round16/environment/public
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r services/analysis/requirements-test.txt
      - name: Synthetic unit and independent schema tests
        env:
          PYTHONPATH: services/analysis/src
        run: |
          python -m unittest discover -s tests/core -v
          python -m unittest discover -s tests/contracts -v
          python -m unittest discover -s tests/integration -v
      - name: Parser boundary tests
        env:
          PYTHONPATH: services/analysis/src
        run: python -m unittest discover -s tests/parsers -v
      - name: Synthetic packet envelope tests
        env:
          PYTHONPATH: services/analysis/src
        run: python -m unittest discover -s tests/packets -v
      - name: Worker process supervision tests
        run: python -m unittest discover -s tests/worker -v
      - name: Isolated recovery and capacity regression
        env:
          PYTHONPATH: services/worker:services/analysis/src
        run: python -m unittest discover -s tests/isolated -v
      - name: Evidence web and bounded replay skeleton
        env:
          PYTHONPATH: services/analysis/src
        run: |
          python -m unittest discover -s tests/evidence_web -v
          python -m unittest discover -s tests/replay -v
      - name: Backup reference validation
        env:
          PYTHONPATH: services/analysis/src
        run: python -m unittest discover -s tests/backup -v
      - name: Strict executor content comparison regression
        env:
          PYTHONPATH: services/analysis/src:services/worker
        run: |
          python -m unittest discover -s tests/consistency -v
          python -m unittest discover -s tests/ops -v
      - name: Intake, compatibility and isolated evaluation contracts
        env:
          PYTHONPATH: services/analysis/src:services/worker
        run: |
          python -m unittest discover -s tests/intake -v
          python -m unittest discover -s tests/evaluation -v
          python -m unittest discover -s tests/compatibility -v
          python scripts/validation/round8_evaluation_audit.py
      - name: Legacy unsupported-path regression
        run: python -m unittest discover -s tests/legacy -v
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go build ./...
      - run: go vet ./...
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-static
          path: webui/out

  service-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r services/python-cpag-generator/requirements-test.txt
      - run: python -m unittest discover -s tests/service -v

  m4-postgres-prototype:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: m4_validation
          POSTGRES_PASSWORD: m4-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d m4_validation"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Isolated repository fault tests (not production executor)
        working-directory: internal/jobs/integration
        env:
          M4_TEST_DATABASE_URL: postgres://postgres:m4-disposable-only@localhost:5432/m4_validation?sslmode=disable
        run: go test -race -count=1 -v ./...

  m4-worker-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Isolated Worker, PostgreSQL and real-process fault matrix
        run: scripts/m4/validate-worker.sh
      - name: Database outage and independent recovery restart
        run: bash scripts/m4/validate-round6-recovery.sh

  linux-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Strict timeout evidence negative regressions
        run: python -m unittest discover -s tests/isolation -v
      - name: Real container resource and double-crash probes
        run: python scripts/m4/linux-isolation/validate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-isolation-evidence
          path: docs/refactor/validation-round10/linux-results.json

  backup-restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r services/analysis/requirements-test.txt
      - name: Independent PostgreSQL and artifact bundle restore
        run: python scripts/backup/validate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backup-restore-evidence
          path: docs/refactor/validation-round6/backup-integration-summary.json

  isolated-executor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Real isolated task publication and historical-attempt recovery
        run: bash scripts/m4/isolated/validate-isolated.sh

  engineering-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Actual shared-core legacy and isolated execution
        run: python scripts/validation/round7-consistency.py
      - name: Capacity repair and resumed real Docker admission
        run: bash scripts/ops/validate-capacity-rebuild.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engineering-native-ci-evidence
          path: |
            docs/refactor/validation-round7/consistency-summary.json
            docs/refactor/validation-round7/consistency-result.json
            docs/refactor/validation-round7/capacity-live-summary.json

  celery-live-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r services/python-cpag-generator/requirements-test.txt -r services/analysis/requirements-test.txt
      - name: Real RabbitMQ Celery Redis synthetic HTTP chain
        run: python scripts/validation/round9_celery.py --evidence docs/refactor/validation-round9/celery-live.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: celery-live-compatibility-evidence
          path: |
            docs/refactor/validation-round9/celery-live.json
            docs/refactor/validation-round9/celery-api.log
            docs/refactor/validation-round9/celery-worker.log

  synthetic-scaling:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Benchmark measurement and failure regressions
        run: python -m unittest discover -s tests/benchmarks -v
      - name: Registered bounded Linux synthetic scaling
        run: python scripts/benchmarks/run_scaling.py --output docs/refactor/validation-round11/linux-ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-scaling-evidence
          path: docs/refactor/validation-round11/linux-ci.json

  dual-source-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r services/analysis/requirements-test.txt
      - name: Independently specified dual-source scenarios and evidence boundaries
        run: python -m unittest discover -s tests/dual_source -v
      - name: Full synthetic dual-source CLI and original-evidence example
        run: python scripts/validation/round12_dual_source.py --output "$RUNNER_TEMP/dual-source-example"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dual-source-analysis-evidence
          path: ${{ runner.temp }}/dual-source-example

  dual-source-celery:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r services/python-cpag-generator/requirements-test.txt -r services/analysis/requirements-test.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: frontend-static
          path: webui/out
      - name: Browser acceptance runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.61.0
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Actual Celery task and full browser evidence flow
        run: |
          python scripts/validation/round13_celery.py --output "$RUNNER_TEMP/dual-source-celery" --serve --ui-port 18300 > "$RUNNER_TEMP/dual-source-startup.log" 2>&1 &
          validation_pid=$!
          trap 'kill -TERM "$validation_pid" 2>/dev/null || true; wait "$validation_pid" || true' EXIT
          for attempt in $(seq 1 180); do
            if test -f "$RUNNER_TEMP/dual-source-celery/results.json"; then break; fi
            if ! kill -0 "$validation_pid" 2>/dev/null; then cat "$RUNNER_TEMP/dual-source-startup.log"; exit 1; fi
            sleep 2
          done
          python -c 'import json,os; from pathlib import Path; assert json.loads((Path(os.environ["RUNNER_TEMP"])/"dual-source-celery/results.json").read_text())["status"] == "passed"'
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser/node_modules/playwright" node scripts/validation/round13_browser.cjs "$RUNNER_TEMP/dual-source-celery" "$RUNNER_TEMP/dual-source-browser"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dual-source-celery-evidence
          path: |
            ${{ runner.temp }}/dual-source-celery
            ${{ runner.temp }}/dual-source-browser
            ${{ runner.temp }}/dual-source-startup.log

  dual-source-persistent:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -r services/python-cpag-generator/requirements-test.txt -r services/analysis/requirements-test.txt
      - uses: actions/download-artifact@v4
        with:
          name: frontend-static
          path: webui/out
      - run: npm install --prefix "$RUNNER_TEMP/browser" playwright@1.61.0
      - run: "$RUNNER_TEMP/browser/node_modules/.bin/playwright install --with-deps chromium"
      - name: Dual isolated cancellation, retry and publication faults
        run: bash scripts/m4/isolated/validate-isolated-dual.sh
      - name: Celery parity, empty database restore and existing UI evidence
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser/node_modules/playwright
        run: bash scripts/validation/round14_acceptance.sh "$RUNNER_TEMP/round14"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dual-source-persistent-evidence
          path: |
            ${{ runner.temp }}/round14/public
            ${{ runner.temp }}/round14/*.log
            ${{ runner.temp }}/round14/celery/api.log
            ${{ runner.temp }}/round14/celery/worker.log
            ${{ runner.temp }}/round14/browser
